name: Daily AI Security Digest

on:
  schedule:
    # 12:00 UTC daily. Cron is UTC-only; adjust here if the desired local
    # send time changes (e.g. for DST), there's no timezone param.
    - cron: "0 12 * * *"
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: write # to commit data/seen.json + the day's digest back to the repo

concurrency:
  group: ai-security-digest
  cancel-in-progress: false # never cancel a mid-flight run; let it finish or fail cleanly

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest feeds + GitHub advisories
        run: python ingest.py

      - name: Filter, dedupe, and rank
        run: python filter_rank.py

      - name: Summarize with Claude Haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python summarize.py

      - name: Render Markdown digest
        run: python render.py

      - name: Upload digest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest/*.md
          retention-days: 30

      - name: Get digest date
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Sends via an existing Gmail account (no new third-party service).
      # Requires three repo secrets:
      #   EMAIL_USERNAME - the Gmail address sending the digest
      #   EMAIL_PASSWORD - a Gmail App Password (not the account password;
      #                    needs 2-Step Verification on, generated at
      #                    myaccount.google.com/apppasswords)
      #   DIGEST_TO      - recipient address (can be the same Gmail address)
      - name: Email digest via Gmail SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "AI Security Digest — ${{ steps.date.outputs.value }}"
          to: ${{ secrets.DIGEST_TO }}
          from: "AI Security Digest <${{ secrets.EMAIL_USERNAME }}>"
          body: file://digest/${{ steps.date.outputs.value }}.md
          convert_markdown: true

      - name: Commit seen-store + digest back to repo
        run: |
          git config user.name "ai-security-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json digest/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Digest for $(date -u +%Y-%m-%d)"
            git push
          fi
