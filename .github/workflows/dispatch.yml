name: Daily AI Security Digest

on:
  schedule:
    # 12:00 UTC daily. Cron is UTC-only; adjust here if the desired local
    # send time changes (e.g. for DST), there's no timezone param.
    - cron: "0 12 * * *"
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: write # to commit data/seen.json + the day's digest back to the repo

concurrency:
  group: ai-security-digest
  cancel-in-progress: false # never cancel a mid-flight run; let it finish or fail cleanly

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest feeds + GitHub advisories
        run: python ingest.py

      - name: Filter, dedupe, and rank
        run: python filter_rank.py

      - name: Summarize with Claude Haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python summarize.py

      - name: Render Markdown digest
        run: python render.py

      - name: Upload digest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest/*.md
          retention-days: 30

      - name: Get digest date
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Resend's shared sandbox sender (onboarding@resend.dev) needs no
      # domain verification, but only delivers to the address the Resend
      # account itself was signed up with - which is exactly
      # DIGEST_TARGET_EMAIL here, since this digest is only ever sent to
      # its own owner.
      # Requires two repo secrets:
      #   RESEND_API_KEY      - from the Resend dashboard
      #   DIGEST_TARGET_EMAIL - the email address you signed up to Resend with
      - name: Email digest via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TARGET_EMAIL }}
          DIGEST_DATE: ${{ steps.date.outputs.value }}
        run: |
          pip install markdown
          python - <<'PY'
          import os
          import pathlib
          import markdown
          import requests

          date_str = os.environ["DIGEST_DATE"]
          digest_path = pathlib.Path("digest") / f"{date_str}.md"
          md_text = digest_path.read_text(encoding="utf-8")
          html_body = markdown.markdown(md_text)

          resp = requests.post(
              "https://api.resend.com/emails",
              headers={"Authorization": f"Bearer {os.environ['RESEND_API_KEY']}"},
              json={
                  "from": "AI Security Digest <onboarding@resend.dev>",
                  "to": [os.environ["DIGEST_TO"]],
                  "subject": f"AI Security Digest — {date_str}",
                  "html": html_body,
                  "text": md_text,
              },
              timeout=20,
          )
          if not resp.ok:
              print(f"Resend API error {resp.status_code}: {resp.text}")
          resp.raise_for_status()
          PY

      - name: Commit seen-store + digest back to repo
        run: |
          git config user.name "ai-security-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json digest/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Digest for $(date -u +%Y-%m-%d)"
            git push
          fi
